<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Timeline evacuate">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="1200" height="470" fill="#FFFFFF"/>
<text x="40.0" y="52.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="bold" fill="#0F172A" text-anchor="start">Timeline evacuate khi tắt một compute (lab)</text>
<text x="40.0" y="80.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="normal" fill="#475569" text-anchor="start">T = thời điểm host monitor gửi notification · VM boot từ volume, có HA_Enabled=True</text>
<line x1="60.0" y1="250.0" x2="1140.0" y2="250.0" stroke="#334155" stroke-width="3"/>
<rect x="60.0" y="130.0" width="230.0" height="92.0" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
<text x="74.0" y="154.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0F172A" text-anchor="start">Trước T: phát hiện</text>
<text x="74.0" y="176.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">Kubernetes đánh dấu node</text>
<text x="74.0" y="194.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">NotReady, rồi host monitor</text>
<text x="74.0" y="212.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">cần 3 mẫu × 30 s liên tiếp</text>
<circle cx="330.0" cy="250" r="9" fill="#DC2626"/>
<rect x="300.0" y="132.0" width="200.0" height="90.0" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
