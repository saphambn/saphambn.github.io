<text x="830.0" y="294.0" font-family="'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="bold" fill="#0F172A" text-anchor="start">longhorn.io/storage-node=enabled</text>
<text x="830.0" y="312.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start">(cả pod hệ thống do Longhorn tự tạo)</text>
<text x="40.0" y="618.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="start">Mất một node: volume vẫn đọc/ghi được từ replica còn lại, Longhorn dựng lại replica thứ hai ở node khác.</text>
<text x="40.0" y="644.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="start">Dung lượng thực dùng = kích thước PVC × số replica. Ví dụ PVC 10 GiB với 2 replica chiếm 20 GiB trên đĩa.</text>
