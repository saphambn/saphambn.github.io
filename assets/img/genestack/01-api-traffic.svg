<text x="560.0" y="422.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="start" >Bị reset sau TLS handshake: không có SNI nên Envoy không chọn được route.</text>
