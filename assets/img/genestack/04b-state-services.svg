<text x="630.0" y="538.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">Cache token Keystone và dữ liệu API.</text>
<text x="630.0" y="558.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">Mất cache chỉ làm chậm, không mất dữ liệu.</text>
<text x="40.0" y="630.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="start">Ba dịch vụ đều đặt mỗi replica trên một controller khác nhau (anti-affinity) – mất một controller vẫn còn 2/3 replica, đủ quorum cho Galera và RabbitMQ.</text>
<text x="40.0" y="656.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="start">Dữ liệu của MariaDB và RabbitMQ nằm trên Longhorn, nên phần 4b phải cài Longhorn trước.</text>
