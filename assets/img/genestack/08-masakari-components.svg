<rect x="40.0" y="530.0" width="1120.0" height="120.0" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="60.0" y="558.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#0F172A" text-anchor="start">VM nào được phục hồi khi host chết?</text>
<text x="60.0" y="584.0" font-family="'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="normal" fill="#475569" text-anchor="start">evacuate_all_instances = false (mặc định của lab) → chỉ VM có metadata HA_Enabled=True</text>
<text x="60.0" y="608.0" font-family="'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="normal" fill="#475569" text-anchor="start">evacuate_all_instances = true → mọi VM trên host</text>
<text x="60.0" y="634.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0F172A" text-anchor="start">VM boot từ volume (Cinder) giữ nguyên dữ liệu; VM dùng disk ephemeral được dựng lại từ image.</text>
